<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الدبلوم العالي لإعداد المعلمين - الجامعة الأردنية / فرع العقبة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 650px;
            width: 90%;
            margin: 20px;
        }

        /* تنسيق الصورة الأصلية وتحريكها بحركة انسيابية لطيفة */
        .robot-img {
            width: 100%;
            max-width: 550px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            animation: floatRobot 3s ease-in-out infinite;
        }

        /* تأثير الحركة (الصعود والنزول المستمر) */
        @keyframes floatRobot {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .welcome-text {
            margin-top: 20px;
            font-size: 1.3rem;
            color: #1b3b6f;
            fontين-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- عرض صورتك الأصلية كما رفعتها بالضبط -->
        <img src="روبرت.png" alt="شخصية روبرت الترحيبية" class="robot-img">
    </div>

</body>
</html>
