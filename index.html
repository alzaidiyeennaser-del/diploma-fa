    <script>
        const faqs = [
            { id: 1, q: "ما رؤية برنامج الدبلوم العالي لإعداد المعلمين؟", a: "الريادة في إعداد معلمين مؤهلين يمتلكون الكفايات المهنية والتربوية والرقمية، وقادرين على قيادة التعلم الفاعل والمساهمة في تطوير التعليم وخدمة المجتمع وفق معايير الجودة والتميز." },
            { id: 2, q: "ما رسالة برنامج الدبلوم العالي لإعداد المعلمين؟", a: "إعداد معلمين مؤهلين علميًا ومهنيًا من خلال برنامج تربوي نوعي يجمع بين المعرفة النظرية والممارسة التطبيقية، ويعزز الكفايات التدريسية، والتعلم النشط، والتوظيف الفاعل للتكنولوجيا، والتأمل المهني، بما ينسجم مع رسالة الجامعة الأردنية – فرع العقبة، وكلية اللغات في تحقيق التميز الأكاديمي وخدمة المجتمع وبناء مجتمع المعرفة." },
            { id: 3, q: "ما أهداف برنامج الدبلوم العالي لإعداد المعلمين؟", a: "1. إعداد معلمين يمتلكون المعارف التربوية والتخصصية والكفايات المهنية اللازمة لممارسة مهنة التعليم بكفاءة وفاعلية.\n2. تمكين المعلمين من تصميم بيئات تعلم فاعلة ومبتكرة من خلال توظيف استراتيجيات التدريس الحديثة والتعلم النشط والتكنولوجيا التعليمية بما يلبي احتياجات المتعلمين.\n3. تحقيق التكامل بين المعرفة النظرية والممارسة العملية من خلال التدريب الميداني والممارسات التأملية، بما يسهم في بناء الهوية المهنية للمعلم وتطوير أدائه المستمر.\n4. تنمية مهارات التفكير الناقد وحل المشكلات والبحث الإجرائي واتخاذ القرارات المبنية على الأدلة لتطوير الممارسات التعليمية ومواجهة تحديات التعليم المعاصر.\n5. تعزيز القيم المهنية والأخلاقية والمسؤولية المجتمعية لدى المعلمين، وتمكينهم من الإسهام في خدمة المجتمع المحلي وتطبيق مبادئ التعليم الدامج وتوفير بيئات تعلم عادلة ومحفزة لجميع الطلبة." },
            { id: 4, q: "ماهي مزايا برنامج الدبلوم العالي لإعداد المعلمين؟", a: "1. يتيح البرنامج للطلبة المبتعثين من وزارة التربية والتعليم فرصة الالتحاق بمهنة التعليم بعد إكمال متطلبات البرنامج بنجاح، وفق الإجراءات والأنظمة المعتمدة من الوزارة.\n2. توظيف مباشر لأوائل التخصصات.\n3. الحصول على تأهيل تربوي مهني معتمد يعزز جاهزية الخريج لممارسة مهنة التعليم، ويزيد من فرصه في التوظيف في المؤسسات التعليمية الحكومية والخاصة.\n4. الحصول على رتبة معلم مساعد في حال التعيين (علاوة 35% على الراتب الأساسي).\n5. الربط بين مخرجات البرنامج وااحتياجات سوق العمل التربوي من خلال إعداد معلمين متخصصين في مجالات تعليمية مطلوبة وفق الاحتياجات الوطنية." },
            { id: 5, q: "أين يقع مقر البرنامج؟", a: "يُنفذ البرنامج في الجامعة الأردنية – فرع العقبة، وفق المرافق والقاعات المعتمدة للبرنامج والجامعة." },
            { id: 6, q: "متى يبدأ الدوام؟", a: "يحدد موعد بدء الدراسة وفق التقويم الجامعي والجدول الدراسي الرسمي، ويتم الإعلان عن المواعيد للطلبة عبر القنوات الرسمية للجامعة." },
            { id: 7, q: "كيف أعرف جدولي الدراسي؟", a: "يتم الإعلان عن الجدول الدراسي من خلال القنوات الأكاديمية والإلكترونية الرسمية للجامعة، ويمكن للطالب متابعة التعليمات المتعلقة بالتسجيل والجدول من خلال الجهات المختصة." },
            { id: 8, q: "هل يوجد تعليم إلكتروني في البرنامج؟", a: "قد يتم توظيف أدوات وتقنيات التعلم الإلكتروني ضمن العملية التعليمية وفق طبيعة المساق والخطة المعتمدة، بما يدعم التعلم والتواصل والأنشطة التعليمية." },
            { id: 9, q: "هل يوجد ملف إنجاز للطالب المعلم؟", a: "نعم، يمكن أن يتضمن البرنامج ملف إنجاز مهني يجمع الأدلة التي توثق تطور كفايات الطالب المعلم وأدائه الأكاديمي والميداني والمهني، وفق متطلبات البرنامج." },
            { id: 10, q: "ما المقصود بـ SEP؟", a: "يشير SEP (School Experience Period) إلى فترة الخبرة أو التدريب المدرسي التي يقضيها الطالب المعلم في المدرسة لتطبيق المعارف والمهارات التي اكتسبها في البرنامج، ويخضع خلالها للمتابعة والإشراف والتقييم." },
            { id: 11, q: "من هو SM؟", a: "يشير SM (School Mentor) إلى المعلم/المعلم المتعاون في المدرسة الذي يتولى دعم الطالب المعلم ومتابعته وتقديم التغذية الراجعة حول أدائه أثناء الخبرة المدرسية." },
            { id: 12, q: "من هو TE؟", a: "يشير TE (Teacher Educator) إلى عضو هيئة التدريس أو المربي الأكاديمي المسؤول عن الإشراف الأكاديمي على الطالب المعلم ومتابعة تطوره المهني وربط الجانب النظري بالتطبيق الميداني." },
            { id: 13, q: "هل يوجد تقييم ذاتي للطالب المعلم؟", a: "نعم، يمكن أن يستخدم الطالب المعلم أدوات التقييم الذاتي المبني على معايير المعلمين لمتابعة نموه المهني وتحديد نقاط القوة ومجالات التحسين، مع تقديم الأدلة الداعمة لكل مستوى من مستويات الأداء." },
            { id: 14, q: "هل يستطيع الطالب معرفة مستوى أدائه المهني؟", a: "نعم. يعتمد البرنامج على مجموعة من أدوات التقييم والتغذية الراجعة التي تساعد الطالب المعلم على معرفة مستوى تقدمه في الكفايات المهنية، وتحديد جوانب القوة والجوانب التي تحتاج إلى تطوير." },
            { id: 15, q: "ماهي المدة الدراسة النظامية؟", a: "سنة دراسية واحدة (فصلان دراسيان)." },
            { id: 16, q: "ما هو عدد ساعات الدراسة المعتمدة والمدة الزمنية؟", a: "يتكون برنامج الدبلوم العالي في إعداد وتأهيل المعلمين قبل الخدمة المنتهي بالتعيين في الجامعة الأردنية/فرع العقبة من 27 ساعة معتمدة، موزعة على فصلين دراسيين؛ بواقع 12 ساعة معتمدة في الفصل الأول و15 ساعة معتمدة في الفصل الثاني. ويجمع البرنامج بين الدراسة الأكاديمية والتطبيق العملي والتدريب الميداني، بحيث يخصص ما لا يقل عن 50% من الزمن المقرر للمواد الدراسية للتطبيق والتدريب الميداني." },
            { id: 17, q: "هل الدراسة في البرنامج بنظام الفصول الدراسية أم بنظام الساعات؟", a: "يُدرس البرنامج وفق نظام الساعات المعتمدة، ويُسجل الطالب المقررات وفق الخطة الدراسية المعتمدة والعبء الدراسي المسموح به في كل فصل." },
            { id: 18, q: "كم عدد المقررات التي يدرسها الطالب في كل فصل؟", a: "يختلف عدد المقررات من فصل إلى آخر وفق الخطة الدراسية والعبء الدراسي المعتمد، وبما يتناسب مع متطلبات البرنامج وقدرة الطالب على إكمال متطلبات الدراسة." },
            { id: 19, q: "هل يمكن للطالب اختيار المقررات التي يرغب في دراستها؟", a: "يلتزم الطالب بالمقررات الإلزامية الواردة في الخطة الدراسية، ويمكنه اختيار المقررات الاختيارية -إن وجدت- وفق الضوابط والخطة الدراسية المعتمدة." },
            { id: 20, q: "هل توجد مقررات متطلبات سابقة يجب اجتيازها قبل دراسة مقررات أخرى؟", a: "نعم، قد تتضمن الخطة الدراسية مقررات لها متطلبات سابقة، ويلتزم الطالب بترتيب تسجيل المقررات وفق الخطة الدراسية والتعليمات الأكاديمية المعتمدة." },
            { id: 21, q: "هل توجد مواد إجبارية ومواد اختيارية في الخطة الدراسية؟", a: "تحدد الخطة الدراسية المعتمدة المقررات الإجبارية والمقررات الاختيارية، ويلتزم الطالب باستكمال جميع المتطلبات اللازمة للتخرج." },
            { id: 22, q: "هل يمكن للطالب تسجيل عدد ساعات أقل من العبء الدراسي المعتاد؟", a: "يمكن ذلك وفق الأنظمة والتعليمات الأكاديمية المعمول بها في الجامعة، وبما لا يتعارض مع متطلبات البرنامج والحدود المسموح بها للتسجيل." },
            { id: 23, q: "هل يمكن إنهاء متطلبات الدبلوم في مدة أقصر من المدة النظامية؟", a: "يعتمد ذلك على الخطة الدراسية والحد الأعلى والأدنى للساعات التي يسمح للطالب بتسجيلها في الفصل الدراسي، وعلى توافر المقررات والمتطلبات السابقة." },
            { id: 24, q: "ما أيام وأوقات المحاضرات؟", a: "تحدد أيام وأوقات المحاضرات وفق الجدول الدراسي المعتمد لكل فصل، ويُعلن الجدول للطلبة قبل بدء الدراسة." },
            { id: 25, q: "هل المحاضرات صباحية أم مسائية؟", a: "تعتمد أوقات الدراسة وفق الجدول الدراسي الذي يقره البرنامج والجامعة، وقد تختلف الأوقات من فصل إلى آخر." },
            { id: 26, q: "هل جميع المحاضرات وجاهية أم يوجد تعليم إلكتروني؟", a: "يُحدد نمط التدريس وفق الخطة الدراسية والقرارات والتعليمات المعتمدة في الجامعة، وقد يتضمن البرنامج أنشطة أو تعلمًا إلكترونيًا وفق متطلبات المقرر." },
            { id: 27, q: "هل يمكن حضور بعض المحاضرات عن بُعد عند وجود ظروف استثنائية؟", a: "يخضع ذلك للسياسات والتعليمات المعتمدة في الجامعة، ولا يُعد الحضور عن بُعد بديلاً تلقائياً عن الحضور الوجاهي إلا في الحالات المسموح بها رسمياً." },
            { id: 28, q: "هل تتوفر قاعات ومختبرات وتجهيزات تعليمية مناسبة للطلبة؟", a: "يوفر البرنامج، بالتنسيق مع الجامعة، البيئة التعليمية والمرافق والتجهيزات اللازمة لدعم تعلم الطلبة وتنفيذ الأنشطة التعليمية والتطبيقية وفق الإمكانات والسياسات المعتمدة." },
            { id: 29, q: "ما التخصصات التي يُؤهل البرنامج الطلبة لتدريسها؟", a: "يشمل البرنامج في فرع الجامعة الأردنية بالعقبة مجموعة من التخصصات الأكاديمية التي تلبي احتياجات الميدان التربوي، وهي:\n1. التربية الإسلامية.\n2. التربية المهنية.\n3. اللغة العربية.\n4. اللغة الإنجليزية.\n5. الرياضيات.\n6. العلوم.\n7. الإرشاد النفسي.\n8. المناهج العامة." },
            { id: 30, q: "أنا طالب جامعي، هل يمكنني التقديم للبرنامج؟", a: "البرنامج مخصص لإعداد وتأهيل المعلمين قبل الخدمة، ولذلك يستهدف الحاصلين على درجة البكالوريوس ممن تنطبق عليهم شروط الترشيح والقبول المعتمدة. ولا يُعد البرنامج مسارًا للطلبة الذين لم يحصلوا بعد على درجة البكالوريوس. وبالنسبة للعام الجامعي 2026/2027، يتم القبول في البرنامج من خلال الترشيح من وزارة التربية والتعليم وفق الإجراءات والأسس المعلنة." },
            { id: 31, q: "ما التخصصات الجامعية التي يمكن لحاملها الالتحاق بالبرنامج؟", a: "يُقبل المتقدمون وفق التخصص الجامعي الذي يتوافق مع تخصص الدبلوم المطلوب ووفق شروط الترشيح والقبول المعتمدة من وزارة التربية والتعليم والجامعة. وعليه، لا يعتمد القبول على الرغبة الشخصية فقط، وإنما على مدى توافق مؤهل البكالوريوس مع التخصص التعليمي المطلوب والاحتياجات التعليمية المعتمدة." },
            { id: 32, q: "لدي شهادة جامعية ولكنها ليست في أحد التخصصات التعليمية، هل يمكنني التقديم؟", a: "لا يعني الحصول على درجة البكالوريوس في أي تخصص إمكانية الالتحاق بالبرنامج تلقائيًا؛ إذ يجب أن يكون التخصص الجامعي متوافقًا مع التخصص التعليمي المطلوب وأن يستوفي المتقدم شروط الترشيح والقبول المعتمدة. وتُحدد وزارة التربية والتعليم والجامعة التخصصات والمؤهلات المقبولة وفق الاحتياجات والأسس المعتمدة لكل دفعة." },
            { id: 33, q: "ما المعدل الجامعي المطلوب للقبول؟", a: "يخضع الحد الأدنى للمعدل الجامعي وشروط المفاضلة إلى أسس الترشيح والقبول المعتمدة للدفعة المعلن عنها من الجهات المختصة. ولذلك يُنصح بعدم وضع رقم ثابت في صفحة الأسئلة الشائعة إلا إذا كان واردًا صراحة في إعلان القبول الرسمي للعام الدراسي المعني، لأن شروط القبول والمفاضلة قد تختلف من دفعة إلى أخرى." },
            { id: 34, q: "هل يشترط التفرغ الكامل للالتحاق بالبرنامج؟", a: "نظرًا للطبيعة المهنية والتطبيقية للبرنامج، يتطلب الالتحاق به الالتزام الكامل بمتطلبات الدراسة والتدريب الميداني والحضور والأنشطة التعليمية والمهنية وفق الخطة الدراسية وتعليمات البرنامج؛ ويكتسب ذلك أهمية خاصة لأن البرنامج يتضمن نسبة كبيرة من التطبيق والتدريب الميداني، وليس دراسة نظرية فقط." },
            { id: 35, q: "ما لغة التدريس في البرنامج؟", a: "تُستخدم اللغة العربية واللغة الإنجليزية بحسب طبيعة المساق والتخصص ومتطلبات التعلم، مع الالتزام بلغة التدريس المحددة في توصيف كل مساق والخطة الدراسية المعتمدة." },
            { id: 36, q: "هل يشترط وجود خبرة سابقة في التدريس؟", a: "لا يُفترض اشتراط خبرة تدريسية سابقة؛ فالبرنامج مصمم أساسًا لإعداد وتأهيل المعلمين قبل الخدمة، أي إعداد الخريجين للانتقال إلى الممارسة المهنية في مجال التعليم. ويهدف التدريب الميداني إلى إكساب الطالب المعلم الخبرة العملية اللازمة تحت إشراف أكاديمي وميداني." },
            { id: 37, q: "أين يتم التقديم للبرنامج؟", a: "بالنسبة للعام الجامعي 2026/2027، يتم الترشيح للبرنامج من خلال وزارة التربية والتعليم، وتُظهر منصة الوزارة الرسمية أسماء المرشحين للبرنامج والجامعات التي يعقد فيها، ومنها الجامعة الأردنية/فرع العقبة. وبالتالي، ينبغي التفريق بين الترشيح للبرنامج وبين إجراءات استكمال التسجيل والقبول في الجامعة بعد صدور الترشيح." },
            { id: 38, q: "ما الوثائق المطلوبة للالتحاق بالبرنامج؟", a: "تختلف الوثائق المطلوبة بحسب مرحلة الترشيح والتسجيل، ويجب الالتزام بالقائمة الرسمية التي تحددها وزارة التربية والتعليم والجامعة. وبالنسبة للمرشحين للعام الجامعي 2026/2027، أعلنت وزارة التربية والتعليم عن إجراءات تتضمن مراجعة مديرية التربية والتعليم المعنية لاستلام عقد الإيفاد واستكمال الإجراءات المطلوبة، بما في ذلك الكفالة العدلية وفق الأصول." },
            { id: 39, q: "كم تبلغ تكلفة الدراسة في البرنامج؟", a: "بالنسبة للدفعة الحالية من برنامج الدبلوم العالي في إعداد وتأهيل المعلمين قبل الخدمة المنتهي بالتعيين، يتم تنفيذ البرنامج على نفقة وزارة التربية والتعليم وتنمية الموارد البشرية للمرشحين الذين يتم قبولهم وفق البرنامج المعلن." },
            { id: 40, q: "هل يتضمن البرنامج تدريبًا ميدانيًا في المدارس؟", a: "نعم. يمثل التطبيق والتدريب الميداني مكونًا أساسيًا في البرنامج، ويخصص له ما لا يقل عن 50% من الزمن المقرر للمواد الدراسية. ويهدف التدريب إلى تمكين الطالب المعلم من تطبيق المعارف والمهارات التربوية في البيئة المدرسية الفعلية، تحت إشراف أكاديمي وميداني." },
            { id: 41, q: "كيف يتم تقييم الطالب المعلم؟", a: "يتم تقييم الطالب المعلم من خلال مجموعة متكاملة من أدوات وأساليب التقييم التي تقيس الجوانب المعرفية والتربوية والمهنية والأدائية، بما في ذلك الأداء في المساقات، والتطبيق العملي، والتدريب الميداني، والملاحظة الصفية، وقياس الكفايات المهنية. كذلك مجالات مثل التخطيط، وإجراءات التدريس والتمييز، وإدارة الصف، والتقويم، إضافة إلى جوانب مهنية أخرى." },
            { id: 42, q: "هل يتضمن البرنامج تدريسًا فعليًا داخل الصفوف؟", a: "نعم. لأن البرنامج ذو طبيعة تطبيقية ومهنية، يتضمن التدريب الميداني ممارسة فعلية للتدريس في البيئة المدرسية، بما يسمح للطالب المعلم بتطبيق ما تعلمه في المساقات النظرية وتلقي التغذية الراجعة حول أدائه وتطوير كفاياته التدريسية." },
            { id: 43, q: "ما الكفايات التي يكتسبها الطالب بعد إكمال البرنامج؟", a: "يهدف البرنامج إلى تطوير كفايات المعلم في مجالات متعددة، من أبرزها:\n• المعرفة التخصصية.\n• المعرفة التربوية بالمحتوى.\n• التخطيط للتدريس.\n• استراتيجيات وطرائق التدريس.\n• إدارة البيئة الصفية.\n• التعليم المتمايز ومراعاة الفروق الفردية.\n• التقويم من أجل التعلم.\n• توظيف التكنولوجيا في التعليم.\n• التواصل والتفاعل مع الطلبة.\n• الممارسات المهنية والأخلاقية.\n• التأمل المهني والتطوير المستمر." },
            { id: 44, q: "هل البرنامج منتهي بالتعيين؟", a: "نعم، المسار الحالي للبرنامج هو الدبلوم العالي في إعداد وتأهيل المعلمين قبل الخدمة المنتهي بالتعيين، ويتم ترشيح الطلبة من وزارة التربية والتعليم وفق الاحتياجات والأسس المعتمدة." },
            { id: 45, q: "هل الدبلوم العالي شرط للتعيين في وزارة التربية والتعليم؟", a: "بالنسبة للمسار الحالي للابتعاث، يُعد الحصول على مؤهل الدبلوم العالي لإعداد وتأهيل المعلمين قبل الخدمة أحد متطلبات التعيين في الوظائف التعليمية التي تحددها وزارة التربية والتعليم، وفق شروط وإجراءات التعيين المعتمدة. وتظهر إعلانات الوظائف التعليمية الحديثة اشتراط مؤهل الدبلوم العالي لإعداد وتأهيل المعلمين قبل الخدمة لبعض الوظائف." },
            { id: 46, q: "هل الحصول على الدبلوم يعني التعيين مباشرة؟", a: "البرنامج الحالي هو برنامج ابتعاث منتهي بالتعيين، ويكون المرشح قد دخل المسار بناءً على إجراءات الترشيح والابتعاث التي تحددها وزارة التربية والتعليم. ومع ذلك، يظل التعيين مرتبطًا باستكمال متطلبات البرنامج والنجاح فيه واستيفاء الإجراءات والشروط الرسمية ذات العلاقة." },
            { id: 47, q: "من الجهة المسؤولة عن ترشيح الطلبة للبرنامج؟", a: "تتولى وزارة التربية والتعليم إجراءات الإعلان والترشيح والابتعاث وفق احتياجاتها من الوظائف التعليمية، بينما تتولى الجامعة تنفيذ الجانب الأكاديمي والتدريبي من البرنامج وفق الخطة المعتمدة. وتظهر الإعلانات الرسمية أن المرشحين يتم ترشيحهم من قبل وزارة التربية والتعليم للالتحاق بالجامعات." },
            { id: 48, q: "هل أستطيع اختيار الجامعة التي أدرس فيها؟", a: "يتم تحديد الجامعة التي يلتحق بها المرشح وفق الترشيحات والتخصصات والطاقة الاستيعابية والاحتياجات المعتمدة من الجهات المختصة. لذلك، لا يعني التقدم للبرنامج أن للمتقدم حقًا تلقائيًا في اختيار الجامعة أو الفرع." },
            { id: 49, q: "هل يمكن تغيير التخصص بعد بدء البرنامج؟", a: "لا يُنصح باعتبار تغيير التخصص حقًا تلقائيًا للطالب؛ إذ يرتبط التخصص بالترشيح والابتعاث والاحتياج التعليمي. وأي طلب لتغيير التخصص يخضع للأنظمة والتعليمات وموافقة الجهات المختصة، ولا يتم إلا وفق الإجراءات الرسمية." },
            { id: 50, q: "هل يمكن تغيير الجامعة أو الانتقال إلى فرع آخر بعد القبول؟", a: "الأصل هو الالتزام بالجامعة والفرع المحددين في قرار الترشيح والقبول. وأي انتقال أو تغيير يخضع لموافقة الجهات المختصة ووفق الأنظمة والتعليمات النافذة، ولا يُعد حقًا تلقائيًا للطالب." },
            { id: 51, q: "هل الدراسة في البرنامج نظرية فقط؟", a: "لا. البرنامج مهني وتطبيقي، ولا يقتصر على المحاضرات النظرية؛ إذ يجمع بين المعرفة التربوية والتخصصية والتطبيق العملي والتدريب في البيئة المدرسية. وقد أكدت وزارة التعليم العالي أن برامج إعداد وتأهيل المعلمين تقوم على الجمع بين المساقات النظرية والممارسة العملية في المدارس المتعاونة." },
            { id: 52, q: "هل يوجد تدريب ميداني طوال مدة البرنامج؟", a: "يتضمن البرنامج مكونًا أساسيًا للتطبيق والتدريب الميداني، ويهدف إلى نقل الطالب المعلم من المعرفة النظرية إلى الممارسة الفعلية داخل البيئة المدرسية. ويشكل التطبيق العملي جزءًا جوهريًا من طبيعة البرنامج." },
            { id: 53, q: "هل أستطيع اختيار المدرسة التي سأطبق فيها التدريب الميداني؟", a: "يتم تحديد مدارس التدريب الميداني بالتنسيق بين الجامعة والمدارس المتعاونة والجهات التعليمية ذات العلاقة، وفق احتياجات البرنامج والطاقة الاستيعابية ومتطلبات التدريب. لذلك لا يكون اختيار المدرسة حقًا فرديًا مطلقًا للطالب." },
            { id: 54, q: "هل التدريب الميداني إلزامي؟", a: "نعم. التدريب الميداني والتطبيق العملي من المتطلبات الأساسية لإكمال البرنامج، ويجب على الطالب الالتزام بالحضور والمهام والمسؤوليات المحددة للتدريب، إضافة إلى متطلبات التقييم والإشراف." },
            { id: 55, q: "من يشرف على الطالب أثناء التدريب الميداني؟", a: "يخضع الطالب لإشراف ومتابعة من المشرف الأكاديمي في الجامعة والمعلم المتعاون/المعلم المشرف في المدرسة، وفق آليات الإشراف والتقييم المعتمدة في البرنامج." },
            { id: 56, q: "هل يتم تقييم الطالب المعلم أثناء التدريب الميداني؟", a: "نعم. يخضع الطالب لتقييم مستمر لأدائه المهني والتدريسي، ويشمل ذلك جوانب مثل التخطيط للدرس، وتنفيذ التدريس، وإدارة البيئة الصفية، واستخدام استراتيجيات التدريس، والتقويم، والتواصل مع الطلبة، والتأمل في الممارسة المهنية." },
            { id: 57, q: "متى يبدأ التدريب الميداني بالنسبة للخطة الدراسية؟", a: "يبدأ التدريب الميداني وفق الخطة الدراسية المعتمدة وبعد استيفاء الطالب المتطلبات السابقة المحددة للالتحاق." },
            { id: 58, q: "هل التدريب الميداني مقرر دراسي له ساعات معتمدة؟", a: "نعم، إذا كان التدريب الميداني مقرراً ضمن الخطة الدراسية، فإنه يُعامل وفق عدد الساعات المعتمدة والمتطلبات المحددة في الخطة الدراسية المعتمدة." },
            { id: 59, q: "من المسؤول عن متابعة الطالب أثناء التدريب الميداني؟", a: "يتولى متابعة الطالب فريق التدريب الميداني، بما يشمل المشرف الأكاديمي والمشرف المدرسي/المعلم المتعاون، وفق الأدوار والمسؤوليات المحددة في دليل التدريب الميداني." },
            { id: 60, q: "هل تتم زيارة الطالب في المدرسة من أعضاء هيئة التدريس؟", a: "نعم، تتم متابعة الطالب ميدانياً من خلال الزيارات أو آليات المتابعة المعتمدة للتحقق من تقدمه وتقديم التغذية الراجعة اللازمة." },
            { id: 61, q: "كيف يتم تقييم أداء الطالب في التدريب الميداني؟", a: "يتم تقييم الطالب باستخدام أدوات ومعايير معتمدة، وتشمل -بحسب طبيعة التدريب- التخطيط للتدريس، والتنفيذ، وإدارة الصف، والتقويم، والمهنية، والتأمل في الممارسة." },
            { id: 62, q: "هل يؤثر أداء الطالب في التدريب الميداني على نجاحه وتخرجه؟", a: "نعم. إذا كان التدريب الميداني متطلباً للتخرج، فإن اجتيازه بنجاح يُعد جزءاً أساسياً من استكمال متطلبات البرنامج." },
            { id: 63, q: "ماذا يحدث إذا واجه الطالب مشكلة أثناء التدريب الميداني؟", a: "ينبغي على الطالب إبلاغ المشرف الأكاديمي أو الجهة المسؤولة عن التدريب الميداني في أقرب وقت، ليتم التعامل مع المشكلة وفق الإجراءات المعتمدة." },
            { id: 64, q: "هل يمكن تغيير المدرسة أثناء فترة التدريب الميداني؟", a: "لا يتم تغيير المدرسة بصورة فردية، وإنما يخضع أي تغيير للضرورة والمبررات والإجراءات والموافقات المعتمدة من البرنامج والجهة المشرفة على التدريب." },
            { id: 65, q: "هل التدريب الميداني متاح في المدارس الحكومية والخاصة؟", a: "يتم التدريب في المدارس التي يعتمدها البرنامج بالتنسيق مع الجهات التعليمية ذات العلاقة، وفق الاتفاقيات والإجراءات المعتمدة." },
            { id: 66, q: "هل يحصل طلبة الدبلوم على بطاقة جامعية؟", a: "نعم، يحصل الطالب المقبول والمسجل رسمياً على الخدمات والوثائق الجامعية التي تنطبق على طلبة البرنامج وفق أنظمة الجامعة." },
            { id: 67, q: "هل يستطيع طلبة الدبلوم الاستفادة من خدمات ومرافق الجامعة؟", a: "يستفيد الطلبة من الخدمات والمرافق الجامعية المتاحة لهم وفق الأنظمة والتعليمات المعمول بها." },
            { id: 68, q: "هل تتوفر مكتبة ومصادر تعلم إلكترونية لطلبة البرنامج؟", a: "نعم، يستطيع الطلبة الاستفادة من مصادر التعلم والمكتبة والمصادر الإلكترونية التي توفرها الجامعة وفق الصلاحيات والاشتراكات المعتمدة." },
            { id: 69, q: "هل تتوفر خدمات الإرشاد الأكاديمي للطلبة؟", a: "نعم، يوفر البرنامج الإرشاد الأكاديمي لمساعدة الطلبة في اختيار المقررات، ومتابعة تقدمهم الأكاديمي، ومعالجة الصعوبات التي قد تواجههم." },
            { id: 70, q: "من الجهة التي يمكن للطالب الرجوع إليها عند وجود مشكلة أكاديمية؟", a: "يمكن للطالب البدء بالمرشد الأكاديمي أو منسق البرنامج، بحسب طبيعة المشكلة، ويتم توجيهه إلى الجهة المختصة عند الحاجة." },
            { id: 71, q: "هل توجد أنشطة وفعاليات طلابية يمكن لطلبة الدبلوم المشاركة فيها؟", a: "يمكن للطلبة المشاركة في الأنشطة والفعاليات التي تتيحها الجامعة والكلية والبرنامج وفق الأنظمة المنظمة للأنشطة الطلابية." },
            { id: 72, q: "ماذا يحدث إذا لم ينجح الطالب في أحد المساقات؟", a: "يخضع الطالب في هذه الحالة إلى أنظمة وتعليمات الجامعة المتعلقة بالتقييم والنجاح والإعادة، ويجب عليه استكمال المتطلبات الأكاديمية اللازمة للنجاح في المساق وفق اللوائح المعتمدة." },
            { id: 73, q: "ماذا يحدث إذا لم يجتز الطالب التدريب الميداني؟", a: "نظرًا لأن التدريب الميداني مكون أساسي من البرنامج، فإن عدم استيفاء متطلباته أو عدم تحقيق مستوى الأداء المطلوب يخضع لإجراءات التقييم والمعالجة الأكاديمية المعتمدة في البرنامج والجامعة، وقد يتطلب إعادة بعض متطلبات التدريب أو استكمالها وفق الأنظمة النافذة." },
            { id: 74, q: "هل يوجد امتحانات في البرنامج؟", a: "نعم، يخضع الطالب إلى أساليب تقييم متعددة وفق طبيعة المساق، وقد تشمل الاختبارات، والمهام الفردية والجماعية، والمشروعات، والعروض، والتطبيقات العملية، والملاحظة الصفية، والتقييم الميداني. ولا يعتمد البرنامج على الاختبار النهائي وحده." },
            { id: 75, q: "هل الحضور إلزامي؟", a: "نعم. يتطلب البرنامج الالتزام بالحضور والمشاركة في المحاضرات والأنشطة والتطبيقات والتدريب الميداني وفق تعليمات الجامعة والبرنامج. وتُعد المواظبة جزءًا مهمًا من الالتزام الأكاديمي والمهني للطالب المعلم." },
            { id: 76, q: "ماذا يحدث في حالة الغياب؟", a: "يخضع الغياب إلى تعليمات الحضور والمواظبة المعتمدة في الجامعة والبرنامج. وعلى الطالب تقديم الوثائق الرسمية عند وجود عذر مقبول، والالتزام بأي إجراءات أو متطلبات تعويضية تحددها الجهة الأكاديمية المختصة." },
            { id: 77, q: "هل يمكن للطالب العمل أثناء دراسة الدبلوم؟", a: "نظرًا للطبيعة المكثفة للبرنامج وارتباطه بالتدريب الميداني والالتزام بالحضور، ينبغي على الطالب التأكد من قدرته على الالتزام الكامل بالمتطلبات الأكاديمية والميدانية. كما تخضع مسألة العمل أثناء الابتعاث إلى شروط وتعليمات الابتعاث والعقد المبرم مع الجهة المبتعثة." },
            { id: 78, q: "ماذا يحدث إذا انسحب الطالب من البرنامج؟", a: "يترتب على الانسحاب آثار أكاديمية وإدارية ومالية وفق أنظمة الجامعة وشروط الابتعاث والعقد الموقع مع وزارة التربية والتعليم. لذلك يجب على الطالب مراجعة الجهة المختصة قبل اتخاذ قرار الانسحاب لمعرفة الآثار المترتبة عليه." },
            { id: 79, q: "هل يوجد عقد ابتعاث؟", a: "نعم، في مسار الابتعاث الحالي، يستكمل المرشح إجراءات الابتعاث وفق متطلبات وزارة التربية والتعليم، والتي تشمل توقيع العقد وتقديم الكفالة العدلية وفق الإجراءات المحددة." },
            { id: 80, q: "هل الطالب المبتعث يدفع رسوم تقديم أو رسوم دراسة؟", a: "بالنسبة للطلبة المقبولين ضمن منحة وزارة التربية والتعليم، تكون رسوم طلب الالتحاق مغطاة وفق إجراءات المنحة، وقد أعلنت الجامعات أن الطالب المبعوث لا يقوم بتشكيل فاتورة لرسوم طلب الالتحاق وإنما يستخدم الرقم المرجعي المخصص له." },
            { id: 81, q: "هل يستطيع الطالب اختيار مكان التعيين بعد التخرج؟", a: "لا يكون اختيار مكان التعيين حقًا مطلقًا للطالب؛ إذ يرتبط التعيين بالشواغر والاحتياجات التعليمية والتخصص والجنس وموقع الوظيفة وفق إجراءات وزارة التربية والتعليم. وتوضح إعلانات الوظائف أن الشواغر تحدد المحافظة والمناطق التعليمية والتخصص والجنس في بعض الحالات." },
            { id: 82, q: "هل يمكن أن يكون التعيين في محافظة أخرى غير محافظة السكن؟", a: "نعم، قد يكون التعيين وفق الشواغر والاحتياجات التعليمية وليس بالضرورة وفق مكان إقامة المرشح؛ ولذلك يجب على المتقدم الاطلاع على شروط الوظيفة وموقع الشاغر عند الترشيح والتعيين." },
            { id: 83, q: "هل الدبلوم تؤهل للعمل في المدارس الخاصة؟", a: "البرنامج تؤهل الطالب مهنيًا لممارسة مهنة التعليم، إلا أن التعيين في المدارس الحكومية يخضع لمسار وزارة التربية والتعليم وشروطه، في حين أن العمل في المدارس الخاصة يخضع لشروط وسياسات المدرسة والجهة التعليمية المنظمة." },
            { id: 84, q: "هل يمكن للطالب متابعة الدراسات العليا بعد الحصول على الدبلوم؟", a: "الحصول على الدبلوم العالي لا يمنع من التقدم إلى برامج الدراسات العليا من حيث المبدأ، ولكن القبول في برامج الماجستير أو الدكتوراه يخضع إلى شروط القبول الخاصة بالبرنامج والجامعة، بما في ذلك المؤهلات والمعدلات وأي متطلبات أخرى." }
        ];

        function renderFAQs(data) {
            const container = document.getElementById('faqContainer');
            const stats = document.getElementById('stats');
            container.innerHTML = '';
            
            stats.textContent = `تم العثور على (${data.length}) سؤال وجواب`;

            data.forEach(item => {
                container.innerHTML += `
                    <div class="faq-item">
                        <div class="question"><span class="badge">#${item.id}</span> ${item.q}</div>
                        <div class="answer">${item.a}</div>
                    </div>
                `;
            });
        }

        function searchFAQ() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            if(!input) {
                renderFAQs(faqs);
                document.getElementById('noResult').style.display = 'none';
                return;
            }
            
            const filtered = faqs.filter(item => 
                item.q.toLowerCase().includes(input) || 
                item.a.toLowerCase().includes(input)
            );

            renderFAQs(filtered);
            document.getElementById('noResult').style.display = filtered.length === 0 ? 'block' : 'none';
        }

        renderFAQs(faqs);
    </script>
</body>
</html>
