<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج الدبلوم العالي لإعداد المعلمين - الجامعة الأردنية / فرع العقبة</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Cairo', Tahoma, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 90%;
        }

        /* تنسيق وتحريك الصورة */
        .robot-img {
            width: 320px;
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            animation: floatRobot 3s ease-in-out infinite;
        }

        /* تأثير الحركة (الصعود والنزول المستمر) */
        @keyframes floatRobot {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        .welcome-text {
            margin-top: 25px;
            font-size: 1.5rem;
            color: #1b3b6f;
            font-weight: bold;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- تأكد أن اسم الصورة في مستودع GitHub مطابقة تماماً لـ روبرت.png أو اسم ملفك الإنجليزي -->
        <img src="روبرت.png" alt="روبوت الترحيب" class="robot-img">
        
        <div class="welcome-text">
            أهلاً بكم في الفضاء الرقمي للجامعة الأردنية / فرع العقبة
        </div>
    </div>

</body>
</html>
