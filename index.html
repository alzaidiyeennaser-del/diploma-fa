<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي - الدبلوم العالي لإعداد المعلمين | الجامعة الأردنية العقبة</title>
    <!-- تضمين مكتبة Fuse.js للبحث الذكي والمرن -->
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #3182ce;
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 25px 15px; color: var(--text-main); line-height: 1.6; }
        .container { max-width: 850px; margin: 0 auto; background: var(--card-bg); padding: 35px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.07); }
        
        /* تصميم الهيدر والإنفوجرافيك للصور */
        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed #e2e8f0; padding-bottom: 25px; }
        .logos-container { display: flex; justify-content: space-around; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .logo-img { max-height: 90px; width: auto; object-fit: contain; transition: transform 0.3s ease; }
        .logo-img:hover { transform: scale(1.05); }

        h1 { color: var(--primary-color); font-size: 24px; margin: 10px 0 6px 0; font-weight: 800; }
        .subtitle { color: var(--secondary-color); font-size: 16px; margin: 0; font-weight: 600; }
        
        /* منطقة البحث */
        .search-container { position: sticky; top: 15px; background: var(--card-bg); padding: 10px 0; z-index: 100; }
        .search-box { width: 100%; padding: 18px 22px; font-size: 16px; border: 2px solid #cbd5e0; border-radius: 12px; outline: none; transition: all 0.3s ease; background-color: #f8fafc; }
        .search-box:focus { border-color: var(--accent-color); background-color: #fff; box-shadow: 0 6px 20px rgba(49, 130, 206, 0.2); }
        
        /* مؤشرات ورسائل الصفحة */
        .stats { margin: 15px 5px; font-size: 14px; color: var(--text-muted); text-align: right; display: none; font-weight: 600; }
        .placeholder-card { text-align: center; color: var(--text-muted); padding: 50px 20px; background: #f8fafc; border-radius: 12px; border: 2px dashed #e2e8f0; margin-top: 20px; }
        .placeholder-icon { font-size: 40px; margin-bottom: 10px; display: block; }
        .no-result { display: none; text-align: center; color: #c53030; padding: 35px; font-size: 16px; background: #fff5f5; border-radius: 12px; border: 1px solid #feb2b2; margin-top: 20px; }
        
        /* عناصر الأسئلة والأجوبة */
        .faq-item { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 16px; padding: 22px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: all 0.2s ease; }
        .faq-item:hover { border-color: #cbd5e0; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        .question { font-weight: 700; color: var(--primary-color); font-size: 17px; margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px; }
        .answer { font-size: 15px; color: #4a5568; line-height: 1.8; white-space: pre-line; padding-right: 28px; }
        .badge { background: #ebf8ff; color: var(--secondary-color); padding: 3px 10px; border-radius: 6px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
        
        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            h1 { font-size: 20px; }
            .search-box { padding: 14px 16px; font-size: 15px; }
            .logo-img { max-height: 70px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <!-- قسم الشعارات فوق العنوان -->
            <div class="logos-container">
                <img src="شعار.png" alt="شعار البرنامج" class="logo-img">
                <img src="شعار وحدة الجودة.png" alt="شعار وحدة الجودة" class="logo-img">
            </div>
            <h1>المساعد الذكي لبرنامج الدبلوم العالي لإعداد المعلمين</h1>
            <p class="subtitle">الجامعة الأردنية – فرع العقبة</p>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="اكتب سؤالك أو الكلمة المفتاحية (مثال: الساعات، التعيين، التدريب الميداني)..." onkeyup="searchFAQ()">
        </div>

        <div id="stats" class="stats"></div>
        <div id="placeholder" class="placeholder-card">
            <span class="placeholder-icon">🔍</span>
            <strong>أهلاً بك في المساعد الذكي</strong><br>
            ابتدئ بكتابة سؤالك أو أي كلمة مفتاحية في الخانة أعلاه لعرض الإجابات فوراً.
        </div>
        <div id="faqContainer"></div>
        <div id="noResult" class="no-result">لم يتم العثور على إجابة مطابقة لبحثك. جرب كتابة صياغة أخرى أو كلمات مفتاحية بسيطة.</div>
    </div>

    <script>
        const faqs = [
            { id: 1, q: "ما رؤية برنامج الدبلوم العالي لإعداد المعلمين؟", a: "الريادة في إعداد معلمين مؤهلين يمتلكون الكفايات المهنية والتربوية والرقمية، وقادرين على قيادة التعلم الفاعل والمساهمة في تطوير التعليم وخدمة المجتمع وفق معايير الجودة والتميز." },
            { id: 2, q: "ما رسالة برنامج الدبلوم العالي لإعداد المعلمين؟", a: "إعداد معلمين مؤهلين علميًا ومهنيًا من خلال برنامج تربوي نوعي يجمع بين المعرفة النظرية والممارسة التطبيقية، ويعزز الكفايات التدريسية، والتعلم النشط، والتوظيف الفاعل للتكنولوجيا، والتأمل المهني، بما ينسجم مع رسالة الجامعة الأردنية – فرع العقبة، وكلية اللغات في تحقيق التميز الأكاديمي وخدمة المجتمع وبناء مجتمع المعرفة." },
            { id: 3, q: "ما أهداف برنامج الدبلوم العالي لإعداد المعلمين؟", a: "1. إعداد معلمين يمتلكون المعارف التربوية والتخصصية والكفايات المهنية اللازمة لممارسة مهنة التعليم بكفاءة وفاعلية.\n2. تمكين المعلمين من تصميم بيئات تعلم فاعلة ومبتكرة من خلال توظيف استراتيجيات التدريس الحديثة والتعلم النشط والتكنولوجيا التعليمية بما يلبي احتياجات المتعلمين.\n3. تحقيق التكامل بين المعرفة النظرية والممارسة العملية من خلال التدريب الميداني والممارسات التأملية، بما يسهم في بناء الهوية المهنية للمعلم وتطوير أدائه المستمر.\n4. تنمية مهارات التفكير الناقد وحل المشكلات والبحث الإجرائي واتخاذ القرارات المبنية على الأدلة لتطوير الممارسات التعليمية ومواجهة تحديات التعليم المعاصر.\n5. تعزيز القيم المهنية والأخلاقية والمسؤولية المجتمعية لدى المعلمين، وتمكينهم من الإسهام في خدمة المجتمع المحلي وتطبيق مبادئ التعليم الدامج وتوفير بيئات تعلم عادلة ومحفزة لجميع الطلبة." },
            { id: 4, q: "ماهي مزايا برنامج الدبلوم العالي لإعداد المعلمين؟", a: "1. يتيح البرنامج للطلبة المبتعثين من وزارة التربية والتعليم فرصة الالتحاق بمهنة التعليم بعد إكمال متطلبات البرنامج بنجاح، وفق الإجراءات والأنظمة المعتمدة من الوزارة.\n2. توظيف مباشر لأوائل التخصصات.\n3. الحصول على تأهيل تربوي مهني معتمد يعزز جاهزية الخريج لممارسة مهنة التعليم، ويزيد من فرصه في التوظيف في المؤسسات التعليمية الحكومية والخاصة.\n4. الحصول على رتبة معلم مساعد في حال التعيين (علاوة 35% على الراتب الأساسي).\n5. الربط بين مخرجات البرنامج واحتياجات سوق العمل التربوي من خلال إعداد معلمين متخصصين في مجالات تعليمية مطلوبة وفق الاحتياجات الوطنية." },
            { id: 5, q: "أين يقع مقر البرنامج؟", a: "يُنفذ البرنامج في الجامعة الأردنية – فرع العقبة، وفق المرافق والقاعات المعتمدة للبرنامج والجامعة." },
            { id: 6, q: "متى يبدأ الدوام؟", a: "يحدد موعد بدء الدراسة وفق التقويم الجامعي والجدول الدراسي الرسمي، ويتم الإعلان عن المواعيد للطلبة عبر القنوات الرسمية للجامعة." },
            { id: 7, q: "كيف أعرف جدولي الدراسي؟", a: "يتم الإعلان عن الجدول الدراسي من خلال القنوات الأكاديمية والإلكترونية الرسمية للجامعة، ويمكن للطالب متابعة التعليمات المتعلقة بالتسجيل والجدول من خلال الجهات المختصة." },
            { id: 8, q: "هل يوجد تعليم إلكتروني في البرنامج؟", a: "قد يتم توظيف أدوات وتقنيات التعلم الإلكتروني ضمن العملية التعليمية وفق طبيعة المساق والخطة المعتمدة، بما يدعم التعلم والتواصل والأنشطة التعليمية." },
            { id: 9, q: "هل يوجد ملف إنجاز للطالب المعلم؟", a: "نعم، يمكن أن يتضمن البرنامج ملف إنجاز مهني يجمع الأدلة التي توثق تطور كفايات الطالب المعلم وأدائه الأكاديمي والميداني والمهني، وفق متطلبات البرنامج." },
            { id: 10, q: "ما المقصود بـ SEP؟", a: "يشير SEP (School Experience Period) إلى فترة الخبرة أو التدريب المدرسي التي يقضيها الطالب المعلم في المدرسة لتطبيق المعارف والمهارات التي اكتسبها في البرنامج، ويخضع خلالها للمتابعة والإشراف والتقييم." },
            { id: 11, q: "من هو SM؟", a: "يشير SM (School Mentor) إلى المعلم/المعلم المتعاون في المدرسة الذي يتولى دعم الطالب المعلم ومتابعة تقدمه وإعطائه التغذية الراجعة أثناء الخبرة المدرسية." },
            { id: 12, q: "من هو TE؟", a: "يشير TE (Teacher Educator) إلى عضو هيئة التدريس المسؤول عن الإشراف الأكاديمي على الطالب المعلم ومتابعة تطوره المهني." },
            { id: 13, q: "هل يوجد تقييم ذاتي للطالب المعلم؟", a: "نعم، يستخدم الطالب المعلم أدوات التقييم الذاتي لمتابعة نموه المهني وتحديد جوانب القوة والتحسين." },
            { id: 14, q: "هل يستطيع الطالب معرفة مستوى أدائه المهني؟", a: "نعم، يعتمد البرنامج على أدوات تقييم وتغذية راجعة مستمرة لتحديد تقدم الطالب في الكفايات المهنية." },
            { id: 15, q: "ماهي المدة الدراسة النظامية؟", a: "سنة دراسية واحدة (فصلان دراسيان)." },
            { id: 16, q: "ما هو عدد ساعات الدراسة المعتمدة والمدة الزمنية؟", a: "يتكون البرنامج من 27 ساعة معتمدة موزعة على فصلين دراسيين (12 ساعة في الفصل الأول و15 ساعة في الفصل الثاني)، مع تخصيص 50% على الأقل للتطبيق والتدريب الميداني." },
            { id: 17, q: "هل الدراسة في البرنامج بنظام الفصول الدراسية أم بنظام الساعات؟", a: "يُدرس البرنامج وفق نظام الساعات المعتمدة." },
            { id: 18, q: "كم عدد المقررات التي يدرسها الطالب في كل فصل؟", a: "يختلف العدد وفق الخطة الدراسية والعبء الدراسي المعتمد." },
            { id: 19, q: "هل يمكن للطالب اختيار المقررات التي يرغب في دراستها؟", a: "يلتزم الطالب بالمقررات الإلزامية في الخطة الدراسية مع إمكانية اختيار المقررات الاختيارية إن وجدت." },
            { id: 20, q: "هل توجد مقررات متطلبات سابقة يجب اجتيازها؟", a: "نعم، توجد مقررات تتطلب اجتياز متطلبات سابقة وفق الخطة المعتمدة." },
            { id: 21, q: "هل توجد مواد إجبارية ومواد اختيارية في الخطة الدراسية؟", a: "تحدد الخطة المعتمدة المقررات الإجبارية والاختيارية بشكل واضح." },
            { id: 22, q: "هل يمكن تسجيل ساعات أقل من العبء المعتاد؟", a: "ممكن وفق الأنظمة والتعليمات الأكاديمية وبما لا يتعارض مع شروط التسجيل." },
            { id: 23, q: "هل يمكن إنهاء الدبلوم في مدة أقصر؟", a: "يعتمد ذلك على الحدود المسموح بها في الخطة الدراسية وتوفر المساقات." },
            { id: 24, q: "ما أيام وأوقات المحاضرات؟", a: "تحدد وفق الجدول الدراسي المعتمد والمعلن للطلبة بداية كل فصل." },
            { id: 25, q: "هل المحاضرات صباحية أم مسائية؟", a: "تعتمد على الجدول المقرر من الكلية وقسم البرنامج." },
            { id: 26, q: "هل جميع المحاضرات وجاهية؟", a: "الأصل وجاهي وقد تتضمن أنشطة أو تعلم إلكتروني مساند حسب توصيف المساق." },
            { id: 27, q: "هل يمكن الحضور عن بعد في ظروف استثنائية؟", a: "يخضع للأنظمة الرسمية والتعليمات المعتمدة ولا يعد بديلاً تلقائياً." },
            { id: 28, q: "هل تتوفر قاعات ومختبرات مجهزة؟", a: "نعم، توفر الجامعة البيئة والمرافق التعليمية المناسبة." },
            { id: 29, q: "ما التخصصات التي تؤهل البرنامج لتدريسها؟", a: "1. التربية الإسلامية\n2. التربية المهنية\n3. اللغة العربية\n4. اللغة الإنجليزية\n5. الرياضيات\n6. العلوم\n7. الإرشاد النفسي\n8. المناهج العامة." },
            { id: 30, q: "أنا طالب جامعي، هل يمكنني التقديم؟", a: "البرنامج مخصص للحاصلين على درجة البكالوريوس المبتعثين والمرشحين رسمياً من وزارة التربية والتعليم." },
            { id: 31, q: "ما التخصصات الجامعية المقبولة للالتحاق؟", a: "التخصصات المتوافقة مع التخصصات التعليمية المطلوبة وفق شروط وزارة التربية والتعليم والجامعة." },
            { id: 32, q: "شهادتي في تخصص غير تعليمي، هل أستطيع التقديم؟", a: "يلزم توافق التخصص الجامعي مع التخصص المطلوب في خطة الابتعاث والترشيح." },
            { id: 33, q: "ما المعدل الجامعي المطلوب للقبول؟", a: "يخضع الشروط والمفاضلة لأسس الترشيح المعلنة للدفعة من وزارة التربية والتعليم." },
            { id: 34, q: "هل يشترط التفرغ الكامل للبرنامج؟", a: "نعم، يتطلب البرنامج التفرغ الكامل نظراً لوجود متطلبات تطبيقية وتدريب ميداني مكثف." },
            { id: 35, q: "ما لغة التدريس في البرنامج؟", a: "تُستخدم اللغة العربية واللغة الإنجليزية بحسب التخصص وطبيعة المساق." },
            { id: 36, q: "هل يشترط وجود خبرة تدريسية سابقة؟", a: "لا، فالبرنامج مخصص لإعداد وتأهيل المعلمين قبل الخدمة." },
            { id: 37, q: "أين يتم التقديم للبرنامج؟", a: "يتم الترشيح عبر وزارة التربية والتعليم، ثم استكمال إجراءات القبول في الجامعة الأردنية فرع العقبة." },
            { id: 38, q: "ما الوثائق المطلوبة؟", a: "الوثائق الرسمية المحددة في إعلان القبول وعقد الإيفاد والكفالة العدلية المطلوبة من الوزارة والجامعة." },
            { id: 39, q: "كم تبلغ تكلفة الدراسة؟", a: "تنفذ الدراسة على نفقة وزارة التربية والتعليم للمرشحين المقبولين رسمياً." },
            { id: 40, q: "هل يتضمن البرنامج تدريباً ميدانياً؟", a: "نعم، يخصص 50% من الزمن المقرر للتطبيق والتدريب الميداني في المدارس." },
            { id: 41, q: "كيف يتم تقييم الطالب المعلم؟", a: "عبر تقييمات متنوعة تشمل الاختبارات والأنشطة والتطبيقات الميدانية والملاحظة الصفية وقياس الكفايات." },
            { id: 42, q: "هل يتضمن تدريساً فعلياً بالصفوف؟", a: "نعم، يتضمن ممارسة فعلية للتدريس تحت إشراف أكاديمي وميداني." },
            { id: 43, q: "ما الكفايات التي يكتسبها الطالب؟", a: "التخطيط للتدريس، إدارة الصف، التقويم، التكنولوجيا في التعليم، الممارسات التأملية، والتعليم المتمايز." },
            { id: 44, q: "هل البرنامج منتهي بالتعيين؟", a: "نعم، للمرشحين المبتعثين من وزارة التربية والتعليم عند استكمال المتطلبات بنجاح." },
            { id: 45, q: "هل الدبلوم شرط للتعيين بالوزارة؟", a: "نعم، يعد الحصول عليه شرطاً أساسياً للتعيين في الوظائف التعليمية المحددة." },
            { id: 46, q: "هل التخرج يعني التعيين مباشرة؟", a: "مرتبط باستكمال متطلبات النجاح وتعبئة الشواغر الرسمية وفق إجراءات الوزارة." },
            { id: 47, q: "من الجهة المسؤولة عن الترشيح؟", a: "وزارة التربية والتعليم هي المسؤولة عن الترشيح والابتعاث." },
            { id: 48, q: "هل أستطيع اختيار الجامعة؟", a: "تحدد الجامعة بناءً على الترشيح والتوزيع الجغرافي والطاقة الاستيعابية." },
            { id: 49, q: "هل يمكن تغيير التخصص بعد البدء؟", a: "التغيير غير تلقائي ويخضع لموافقة الجهات المختصة والشواغر المتاحة." },
            { id: 50, q: "هل يمكن النقل لجامعة أو فرع آخر؟", a: "يلتزم الطالب بالفرع المحدد، والنقل يخضع للتعليمات والموافقات الرسمية." },
            { id: 51, q: "هل الدراسة نظرية فقط؟", a: "لا، تجمع بين الجانب النظري والتطبيق العملي الميداني في المدارس." },
            { id: 52, q: "هل التدريب الميداني مستمر طوال الدبلوم؟", a: "نعم، يتوزع على الفصلين الدراسيين كجزء رئيسي من الخطة." },
            { id: 53, q: "هل أستطيع اختيار مدرسة التدريب الميداني؟", a: "يتم توزيع الطلبة على المدارس بالتنسيق بين الجامعة ومديريات التربية." },
            { id: 54, q: "هل التدريب الميداني إلزامي؟", a: "نعم، متطلب إجباري وأساسي للتخرج." },
            { id: 55, q: "من يشرف على الطالب ميدانياً؟", a: "المشرف الأكاديمي من الجامعة والمعلم المتعاون من المدرسة." },
            { id: 56, q: "هل يقيم الطالب في التدريب الميداني؟", a: "نعم، تقييم مستمر على الأداء والتخطيط والإدارة الصفية." },
            { id: 57, q: "متى يبدأ التدريب الميداني؟", a: "وفق الخطة الدراسية المعتمدة مع انطلاق الفصل الدراسي." },
            { id: 58, q: "هل للتدريب الميداني ساعات معتمدة؟", a: "نعم، محسبوب ضمن ساعات الخطة الدراسية." },
            { id: 59, q: "من المسؤول عن متابعة الحضور بالتدريب؟", a: "فريق الإشراف الميداني بالجامعة والمدرسة." },
            { id: 60, q: "هل تزور هيئة التدريس الطالب بالمدارس؟", a: "نعم، تقام زيارات ميدانية إشرافية وتقييمية مستمرة." },
            { id: 61, q: "كيف يحسب تقييم الميداني؟", a: "بناءً على أدوات تقييم معتمدة تشمل الملاحظة الصفية وملف الإنجاز." },
            { id: 62, q: "هل يؤثر الرسوب بالميداني على التخرج؟", a: "نعم، عدم اجتياز الميداني يمنع التخرج لحين استكمال المتطلبات." },
            { id: 63, q: "ما العمل عند مواجهة مشكلة بالمدرسة؟", a: "التواصل الفوري مع المشرف الأكاديمي لحل المشكلة إدارياً." },
            { id: 64, q: "هل يمكن تغيير المدرسة أثناء التدريب؟", a: "لا يتم إلا للحالات الاستثنائية وبموافقة الإشراف الميداني." },
            { id: 65, q: "أين يتاح التدريب الميداني؟", a: "في المدارس الحكومية والخاصة المعتمدة بالتنسيق مع الكلية." },
            { id: 66, q: "هل يحصل الطالب على بطاقة جامعية؟", a: "نعم، يصدر للطالب هوية جامعية رسمية." },
            { id: 67, q: "هل يتاح استخدام مرافق الجامعة؟", a: "نعم، تتاح جميع الخدمات والمرافق الأكاديمية والرياضية للطلبة." },
            { id: 68, q: "هل تتوفر مكتبة ومصادر رقمية؟", a: "نعم، تتاح مكتبة الجامعة واشتراكات قواعد البيانات الإلكترونية." },
            { id: 69, q: "هل يتاح الإرشاد الأكاديمي؟", a: "نعم، يخصص مرشد أكاديمي لكل طالب لمتابعة مساره." },
            { id: 70, q: "أين ألجأ عند وجود مشكلة أكاديمية؟", a: "إلى المرشد الأكاديمي أو منسق البرنامج بالكلية." },
            { id: 71, q: "هل يمكن المشاركة بالأنشطة الطلابية؟", a: "نعم، يحق للطلبة المشاركة في كافة الأنشطة والفعاليات." },
            { id: 72, q: "ماذا يحدث عند الرسوب بمساق؟", a: "يطبق على الطالب نظام الإعادة والتقييم المعمول به بالجامعة." },
            { id: 73, q: "ماذا لو لم يجتز الطالب الميداني؟", a: "يعيد متطلبات التدريب الميداني وفق لوائح الجامعة." },
            { id: 74, q: "هل هناك امتحانات نهائية؟", a: "نعم، تتنوع بين اختبارات وجاهية وتقييمات عملات وميدانية." },
            { id: 75, q: "هل الحضور إلزامي بالجامعة؟", a: "نعم، الالتزام نسبة الحضور شرط أساسي للتقدم للامتحانات." },
            { id: 76, q: "ما عقوبة الغياب عن المحاضرات؟", a: "يطبق الحرمان الأكاديمي عند تجاوز نسبة الغياب المسموحة." },
            { id: 77, q: "هل يمكن العمل أثناء الدراسة؟", a: "يتطلب البرنامج تفرغاً، والعمل يخضع لشروط عقد الابتعاث." },
            { id: 78, q: "ما آثار الانسحاب من البرنامج؟", a: "تترتب عليه شروط مالية وأكاديمية حسب عقد الإيفاد مع الوزارة." },
            { id: 79, q: "هل يوقع الطالب عقد ابتعاث؟", a: "نعم، يلتزم المبتعث بتوقيع عقد وكفالة عدلية مع الوزارة." },
            { id: 80, q: "هل يدفع المبتعث رسوم طلب تقديم؟", a: "لا، تغطى رسوم التقديم والتسجيل ضمن المنحة الرسمية." },
            { id: 81, q: "هل يختار الخريج مكان التعيين؟", a: "التعيين يخضع لجدول الشواغر المعتمد من وزارة التربية." },
            { id: 82, q: "هل قد يكون التعيين خارج محافظة الإقامة؟", a: "نعم، بحسب الشواغر وااحتياجات مديريات التربية." },
            { id: 83, q: "هل يؤهل المؤهل للعمل بالقطاع الخاص؟", a: "نعم، المهارات المكتسبة تعزز فرصة العمل بالمدارس الخاصة أيضاً." },
            { id: 84, q: "هل يمكن إكمال الماجستير بعد الدبلوم؟", a: "نعم، يحق للحاصلين عليه التقديم لبرامج الدراسات العليا وفق الشروط." }
        ];

        const fuseOptions = {
            keys: [
                { name: 'q', weight: 0.7 },
                { name: 'a', weight: 0.3 }
            ],
            threshold: 0.3,
            distance: 100,
            ignoreLocation: true
        };
        const fuse = new Fuse(faqs, fuseOptions);

        function searchFAQ() {
            const input = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('faqContainer');
            const placeholder = document.getElementById('placeholder');
            const noResult = document.getElementById('noResult');
            const stats = document.getElementById('stats');

            if (!input) {
                container.innerHTML = '';
                placeholder.style.display = 'block';
                noResult.style.display = 'none';
                stats.style.display = 'none';
                return;
            }

            placeholder.style.display = 'none';
            
            const results = fuse.search(input);

            if (results.length === 0) {
                container.innerHTML = '';
                noResult.style.display = 'block';
                stats.style.display = 'none';
            } else {
                noResult.style.display = 'none';
                stats.style.display = 'block';
                stats.textContent = `عدد النتائج المطابقة: (${results.length})`;
                
                container.innerHTML = results.map(res => `
                    <div class="faq-item">
                        <div class="question"><span class="badge">سؤال #${res.item.id}</span> ${res.item.q}</div>
                        <div class="answer">${res.item.a}</div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
